<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pichaury — Réassort consommables</title>
<style>
  :root{
    --bg: #F2F4F1;
    --panel: #FFFFFF;
    --ink: #1B2A28;
    --ink-soft: #5C6B68;
    --teal: #1F5652;
    --teal-deep: #143A37;
    --line: #DDE3E0;
    --neutral: #8A9490;
    --neutral-bg: #EEF0EE;
    --ok: #3C7A5E;
    --ok-bg: #E4F0E9;
    --warn: #C77A1F;
    --warn-bg: #FBF0DF;
    --danger: #B4432E;
    --danger-bg: #FBE7E2;
    --radius: 14px;

    --rose: #9C5468;
    --rose-deep: #7A4053;
    --rose-bg: #FBF1F3;
    --green: #3F6B4F;
    --green-deep: #2E5039;
    --green-bg: #EFF5F1;

    --brand-green: #4E9B6B;
    --brand-green-deep: #2F6B41;

    --zone-accent: var(--teal);
    --zone-accent-deep: var(--teal-deep);
  }
  body[data-zone="SUD"]{
    --zone-accent: var(--rose);
    --zone-accent-deep: var(--rose-deep);
    --bg: var(--rose-bg);
  }
  body[data-zone="NORD"]{
    --zone-accent: var(--green);
    --zone-accent-deep: var(--green-deep);
    --bg: var(--green-bg);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition: background .3s ease;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 40px;}

  header{
    color:#fff;
    padding:22px 22px 20px;
    border-radius: 0 0 20px 20px;
    transition: background .3s ease;
  }
  header.header-agent{
    background: linear-gradient(160deg, var(--zone-accent-deep), var(--zone-accent));
  }
  header.header-direction{
    background: linear-gradient(160deg, var(--brand-green-deep), var(--brand-green));
  }
  header.header-login{
    background: linear-gradient(160deg, var(--teal-deep), var(--teal));
  }
  header .brand-logo{
    background:#fff;
    border-radius:10px;
    padding:6px 12px;
    display:inline-block;
    margin-bottom:12px;
  }
  header .brand-logo img{
    display:block;
    height:28px;
    width:auto;
  }
  header .site-label{
    font-size:12.5px;
    letter-spacing:.02em;
    color:#BFE0D6;
    margin:0 0 2px;
  }
  header h1{
    font-size:21px;
    margin:0 0 14px;
    font-weight:650;
    letter-spacing:-.01em;
  }

  .auth-connected{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13.5px;
    margin-bottom:10px;
  }
  .auth-connected .who{ color:#fff; }
  .auth-connected .who .role{ color:#BFE0D6; font-size:12px; }
  .auth-connected button{
    background:none;
    border:none;
    color:#DCEDE7;
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  .mode-switch{
    display:flex;
    gap:6px;
    background:rgba(255,255,255,.12);
    border-radius:11px;
    padding:4px;
    max-width:340px;
  }
  .mode-switch button{
    flex:1;
    padding:8px 0;
    border:none;
    border-radius:8px;
    background:transparent;
    color:#DCEDE7;
    font-size:13px;
    font-weight:650;
    cursor:pointer;
  }
  .mode-switch button.active{
    background:#fff;
    color:var(--teal-deep);
  }

  nav.levels{ display:flex; gap:8px; padding:16px 22px 0; }
  nav.levels button{
    flex:1;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink-soft);
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  nav.levels button.active{ background:var(--zone-accent); border-color:var(--zone-accent); color:#fff; }

  nav.zones{ display:flex; gap:8px; padding:10px 22px 0; }
  nav.zones button{
    flex:1;
    padding:8px 0;
    border-radius:9px;
    border:1px solid transparent;
    background:var(--neutral-bg);
    color:var(--ink-soft);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  nav.zones button.active{ background:#fff; border-color:var(--zone-accent); color:var(--zone-accent-deep); }

  main{padding:14px 22px 0;}

  /* --- Écran de connexion --- */
  .login-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 22px;
    text-align:center;
    margin-top:10px;
  }
  .login-card p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 16px; }
  .login-card input{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:16px;
    text-align:center;
    margin-bottom:12px;
  }
  .login-card button{
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px 0;
    font-size:14.5px;
    font-weight:650;
    cursor:pointer;
  }

  /* --- Alerte --- */
  .alert-banner{
    background:var(--danger-bg);
    border:1px solid #EBC3B8;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--danger);
    font-weight:600;
    line-height:1.4;
  }

  /* --- Stock global --- */
  .stock-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:18px;
  }
  .stock-panel h3{ margin:0 0 10px; font-size:14px; color:var(--teal-deep); font-weight:700; }
  .stock-row{ padding:10px 0; border-bottom:1px solid var(--line); }
  .stock-row:last-child{ border-bottom:none; }
  .stock-row-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .stock-label{ font-size:13.5px; font-weight:650; }
  .stock-input-block{ display:flex; align-items:center; gap:6px; }
  .stock-input-block input{
    width:64px; text-align:center; border:1px solid var(--line);
    border-radius:8px; padding:6px 4px; font-size:14px; font-weight:650;
  }
  .stock-unit{ font-size:11.5px; color:var(--ink-soft); }
  .stock-detail{ font-size:12px; color:var(--ink-soft); margin-top:6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .stock-tag{ font-size:11px; padding:2px 9px; border-radius:20px; font-weight:650; white-space:nowrap; }
  .tag-critique{ background:var(--danger-bg); color:var(--danger); }
  .tag-surveiller{ background:var(--warn-bg); color:var(--warn); }
  .tag-ok{ background:var(--ok-bg); color:var(--ok); }
  .tag-neutral{ background:var(--neutral-bg); color:var(--neutral); }

  .bloc{ margin-bottom:16px; }
  .bloc-header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; padding:0 2px; }
  .bloc-name{ font-size:15px; font-weight:700; color:var(--zone-accent-deep); }
  .bloc-config{ font-size:11.5px; color:var(--ink-soft); }

  .item{
    background:var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding:13px 14px; margin-bottom:8px;
  }
  .item-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .item-name{ font-size:14.5px; font-weight:650; line-height:1.25; }
  .item-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  .chips{ display:flex; gap:8px; margin-top:11px; }
  .chip{
    flex:1; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff;
    font-size:15px; font-weight:650; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .chip:active{ background:var(--zone-accent); border-color:var(--zone-accent); color:#fff; }
  .chip-label{ font-size:11px; color:var(--ink-soft); margin-top:6px; }

  @keyframes chipHighlight{
    0%{ background:var(--zone-accent); border-color:var(--zone-accent); color:#fff; transform:scale(1.06); }
    75%{ background:var(--zone-accent); border-color:var(--zone-accent); color:#fff; transform:scale(1); }
    100%{ background:#fff; border-color:var(--line); color:var(--ink-soft); transform:scale(1); }
  }
  .chip.just-set{ animation: chipHighlight 2s ease forwards; }
  .chip.selected-current{ border-color:var(--zone-accent); border-width:2px; color:var(--zone-accent-deep); font-weight:800; }

  .chip-bottom-row{
    display:flex; justify-content:space-between; align-items:center; margin-top:6px;
  }
  .edit-link-btn{
    background:none; border:none; color:var(--zone-accent-deep); font-size:11.5px;
    text-decoration:underline; cursor:pointer; padding:0; font-weight:650;
  }
  .edit-cancel-btn{
    background:none; border:none; color:var(--ink-soft); font-size:11.5px;
    text-decoration:underline; cursor:pointer; padding:0; margin-top:8px;
  }

  .zone-locked-badge{
    font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }

  #mainContent.view-agent .item{ border-left:4px solid var(--zone-accent); }
  #mainContent.view-agent .chip-label{ color:var(--zone-accent-deep); }

  .stat-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-name{ color:var(--ink); }
  .stat-total{ font-weight:700; color:var(--teal-deep); display:flex; align-items:baseline; gap:4px; }
  .stat-unit{ font-size:11px; color:var(--ink-soft); font-weight:500; }
  .stat-sub{ font-size:11px; color:var(--ink-soft); margin-top:1px; }

  .journal{ margin-top:22px; }
  .journal h3{ font-size:13.5px; color:var(--ink-soft); margin:0 0 8px; padding:0 2px; }
  .journal-entry{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:6px; font-size:12.5px; color:var(--ink-soft);
    display:flex; justify-content:space-between; gap:8px;
  }
  .journal-entry strong{ color:var(--ink); }
  .journal-empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 10px; }

  /* --- Graphiques consommation --- */
  .chart-section{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px;
  }
  .chart-section h3{ margin:0 0 4px; font-size:14.5px; color:var(--ink); font-weight:700; }
  .chart-section .chart-sub{ font-size:11.5px; color:var(--ink-soft); margin-bottom:12px; }
  .bar-row{ margin-bottom:10px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-label-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12.5px; margin-bottom:4px;
  }
  .bar-label-row .bar-place{ font-weight:650; color:var(--ink); }
  .bar-label-row .bar-place .bar-dot{
    display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;
  }
  .bar-label-row .bar-value{ color:var(--ink-soft); font-size:12px; white-space:nowrap; }
  .bar-track{
    background:var(--neutral-bg); border-radius:8px; height:12px; overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:8px; min-width:2px; transition:width .4s ease; }
  .bar-fill.zone-SUD{ background:var(--rose); }
  .bar-fill.zone-NORD{ background:var(--green); }

  .level-heading{
    font-size:12.5px; text-transform:none; color:var(--ink-soft); font-weight:700;
    margin:20px 0 8px; padding:0 2px;
  }
  .level-heading:first-child{ margin-top:0; }
  .bloc-zone-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .bloc-zone-dot.zone-SUD{ background:var(--rose); }
  .bloc-zone-dot.zone-NORD{ background:var(--green); }

  /* --- Gestion des accès --- */
  .access-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-top:22px;
  }
  .access-panel h3{ margin:0 0 10px; font-size:14px; color:var(--teal-deep); font-weight:700; }
  .access-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .access-row:last-child{ border-bottom:none; }
  .access-row .who{ font-weight:650; }
  .access-row .role-badge{
    font-size:10.5px; padding:1px 7px; border-radius:20px; margin-left:6px; font-weight:650;
  }
  .role-agent{ background:var(--neutral-bg); color:var(--ink-soft); }
  .role-direction{ background:var(--ok-bg); color:var(--ok); }
  .zone-badge-SUD{ background:var(--rose-bg); color:var(--rose-deep); }
  .zone-badge-NORD{ background:var(--green-bg); color:var(--green-deep); }
  .access-row .code{ color:var(--ink-soft); font-family:monospace; font-size:12px; }
  .access-row .del-btn{
    background:none; border:none; color:#B7ABA6; font-size:12px; cursor:pointer;
  }
  .access-add{ display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
  .access-add input{
    flex:1; min-width:90px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
  }
  .access-add select{
    border:1px solid var(--line); border-radius:8px; padding:8px 6px; font-size:13px;
  }
  .access-add button{
    background:var(--teal); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:650; cursor:pointer;
  }

  .stock-entry-totals{
    display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--ink-soft);
    padding:8px 0 14px; border-bottom:1px solid var(--line); margin-bottom:8px;
  }
  .stock-entry-totals strong{ color:var(--ink); }
  .stock-entry-totals .total-general{ margin-left:auto; color:var(--teal-deep); }
  .stock-entry-totals .total-general strong{ color:var(--teal-deep); }

  .type-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .type-list-item{
    text-align:left; background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:9px 12px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .type-list-item.selected{
    background:var(--ok-bg); border-color:var(--ok); color:var(--ok);
  }

  .collapsible{ margin-bottom:14px; }
  .collapsible-header{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 16px; font-size:14.5px; font-weight:700; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .collapsible-header .collapsible-chevron{ color:var(--ink-soft); font-size:12px; }
  .collapsible-content{ margin-top:10px; }

  .maintenance-btn{
    background:#fff; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:9px; padding:9px 14px; font-size:12.5px; font-weight:650; cursor:pointer;
  }
  .maintenance-btn.armed{
    background:var(--danger-bg); border-color:#EBC3B8; color:var(--danger);
  }

  .footer-note{
    text-align:center; font-size:11.5px; color:#9AA6A3; margin-top:18px; padding:0 30px;
  }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--teal-deep); color:#fff; padding:9px 16px; border-radius:20px;
    font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>

// Essuie-mains : ratio inconnu au départ, renseigné par Pierre (stock.essuie.ratio).
// Savon : stock et réassort dans la même unité (cartouche), ratio = 1.
function getRatio(type){
  if(type === "papier") return TYPE_CONFIG.papier.fixedRatio;
  if(type === "essuie") return stock.essuie.ratio || null;
  return 1;
}

function formatDateTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  if(sameDay) return "aujourd'hui à " + time;
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'}) + " à " + time;
}

// ---------- Chargement / sauvegarde ----------

async function apiGet(key){
  try{
    const res = await fetch(`/.netlify/functions/storage?key=${encodeURIComponent(key)}`);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.value === null || data.value === undefined) return null;
    return { key, value: data.value };
  }catch(e){
    console.error("Échec de lecture", key, e);
    return null;
  }
}

async function apiSet(key, value){
  try{
    const res = await fetch("/.netlify/functions/storage", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ key, value }),
    });
    if(!res.ok) return null;
    return { key, value };
  }catch(e){
    console.error("Échec d'écriture", key, e);
    return null;
  }
}

async function storageSetWithRetry(key, value, shared, retries){
  retries = retries === undefined ? 2 : retries;
  let lastError = null;
  for(let attempt = 0; attempt <= retries; attempt++){
    const res = await apiSet(key, value);
    if(res) return res;
    lastError = "échec d'écriture";
    console.error(`Échec sauvegarde ${key} (essai ${attempt + 1}/${retries + 1})`);
    if(attempt < retries){
      await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
    }
  }
  console.error(`Sauvegarde définitivement échouée pour ${key}`, lastError);
  return null;
}

// ---------- Authentification par code personnel ----------

async function attemptLogin(code){
  const trimmed = (code || "").trim();
  if(!trimmed){ showToast("Entrez votre code"); return; }
  const person = people.find(p => p.code.toLowerCase() === trimmed.toLowerCase());
  if(!person){
    showToast("Code non reconnu — contactez Pierre");
    return;
  }
  currentPerson = person;
  appState = "app";
  mode = "agent";
  if(person.zone === "SUD" || person.zone === "NORD"){
    currentZone = person.zone;
  }
  await logConnexion(person);
  render();
}

async function logConnexion(person){
  connLog.push({
    id: cryptoId(),
    personId: person.id,
    name: person.name,
    role: person.role,
    at: new Date().toISOString(),
  });
  await saveConnLog();
}

function logout(){
  currentPerson = null;
  appState = "login";
  mode = "agent";
  lastAction = null;
  render();
}

async function addPerson(name, code, role, zone){
  name = (name || "").trim();
  code = (code || "").trim();
  if(!name || !code){ showToast("Nom et code requis"); return; }
  if(people.some(p => p.code.toLowerCase() === code.toLowerCase())){
    showToast("Ce code est déjà utilisé");
    return;
  }
  const finalRole = role === "direction" ? "direction" : "agent";
  const finalZone = finalRole === "agent" && (zone === "SUD" || zone === "NORD") ? zone : null;
  people.push({ id: cryptoId(), name, code, role: finalRole, zone: finalZone });
  await savePeople();
  showToast("Accès ajouté pour " + name);
  render();
}

async function removePerson(id){
  people = people.filter(p => p.id !== id);
  await savePeople();
  render();
}

// ---------- Réassort & stock ----------

async function addReassort(level, zone, bloc, type, qty, unit){
  const nowIso = new Date().toISOString();
  const entry = {
    id: cryptoId(),
    level, zone,
    blocId: bloc.id,
    blocName: bloc.name,
    type, qty, unit: unit || 1,
    agent: currentPerson ? currentPerson.name : "inconnu",
    at: nowIso,
  };
  log.push(entry);
  await saveLog();
  await applyStockDelta(type, -qty, nowIso);

  const cfg = TYPE_CONFIG[type];
  showToast(`Réassort noté : ${qty} ${cfg.unit} — ${bloc.name}`);
  return entry;
}

// Corrige la dernière saisie d'un agent pour un consommable donné.
// Répercute l'écart sur le stock (au lieu de simplement retirer l'ancienne
// valeur puis ajouter la nouvelle, ce qui économise un aller-retour).
async function editLastEntry(level, zone, bloc, type, unit, newQty){
  const entry = lastEntryFor(level, zone, bloc.id, type, unit);
  if(!entry) return;
  const delta = newQty - entry.qty; // positif si on corrige à la hausse
  entry.qty = newQty;
  entry.editedAt = new Date().toISOString();
  await saveLog();
  await applyStockDelta(type, -delta, entry.editedAt);
  showToast("Réassort corrigé");
}

// Applique une variation de stock (négative = consommation, positive = entrée),
// exprimée dans l'unité de réassort (cfg.unit), convertie via getRatio().
async function applyStockDelta(type, deltaInReassortUnit, nowIso){
  const ratio = getRatio(type);
  if(stock[type].qty === null || !ratio) return;
  stock[type].qty = Math.max(0, stock[type].qty + deltaInReassortUnit / ratio);
  stock[type].updatedAt = nowIso;
  await saveStock();
}

async function updateStock(type, value){
  const cfg = TYPE_CONFIG[type];
  const v = parseFloat(value);
  if(isNaN(v) || v < 0) return;
  stock[type] = Object.assign({}, stock[type], {
    qty: v,
    updatedAt: new Date().toISOString(),
    updatedBy: currentPerson ? currentPerson.name : "direction",
  });
  await saveStock();
  showToast(`Stock ${cfg.label.toLowerCase()} mis à jour : ${v} ${cfg.stockUnit}`);
  render();
}

async function updateRatio(value){
  const v = parseInt(value, 10);
  if(isNaN(v) || v <= 0){ showToast("Nombre de paquets par carton invalide"); return; }
  stock.essuie = Object.assign({}, stock.essuie, { ratio: v });
  await saveStock();
  showToast(`Conversion enregistrée : ${v} paquets par carton`);
  render();
}

function consumptionRate(type){
  const cutoff = Date.now() - CONSO_WINDOW_DAYS * 24 * 3600 * 1000;
  const total = log
    .filter(e => e.type === type && new Date(e.at).getTime() >= cutoff)
    .reduce((sum, e) => sum + e.qty, 0);
  return total / CONSO_WINDOW_DAYS;
}

function stockStatus(type){
  const s = stock[type];
  const rawRate = consumptionRate(type); // exprimé dans l'unité de réassort (cfg.unit)

  if(s.qty === null) return { tag: "neutral", label: "Stock non renseigné", rate: rawRate, daysLeft: null };

  const ratio = getRatio(type);
  if(!ratio){
    return { tag: "neutral", label: "Indiquez paquets/carton", rate: rawRate, daysLeft: null };
  }

  const rateInStockUnit = rawRate / ratio;

  if(s.qty <= 0) return { tag: "critique", label: "Stock épuisé", rate: rawRate, daysLeft: 0 };
  if(rateInStockUnit <= 0) return { tag: "ok", label: "Pas de conso. récente", rate: rawRate, daysLeft: null };
  const daysLeft = s.qty / rateInStockUnit;
  if(daysLeft <= CRITICAL_DAYS) return { tag: "critique", label: `Reste ~${Math.round(daysLeft)} j`, rate: rawRate, daysLeft };
  if(daysLeft <= WATCH_DAYS) return { tag: "surveiller", label: `Reste ~${Math.round(daysLeft)} j`, rate: rawRate, daysLeft };
  return { tag: "ok", label: `Reste ~${Math.round(daysLeft)} j`, rate: rawRate, daysLeft };
}

function tagClass(tag){
  if(tag === "critique") return "tag-critique";
  if(tag === "surveiller") return "tag-surveiller";
  if(tag === "ok") return "tag-ok";
  return "tag-neutral";
}

// ---------- Entrées de stock (achats / livraisons) ----------

async function addStockEntry(type, purchaseDate, deliveryDate, qty, price){
  if(!qty || qty <= 0){ showToast("Quantité invalide"); return; }
  const nowIso = new Date().toISOString();
  const entry = {
    id: cryptoId(),
    type, purchaseDate, deliveryDate,
    qty, price: price || 0,
    createdBy: currentPerson ? currentPerson.name : "direction",
    createdAt: nowIso,
  };
  stockEntries.push(entry);
  await saveStockEntries();

  // La quantité saisie ici est déjà dans l'unité de stock (ballots, cartons, cartouches) :
  // on l'ajoute directement, sans passer par le ratio de réassort.
  const current = stock[type].qty === null ? 0 : stock[type].qty;
  stock[type] = Object.assign({}, stock[type], { qty: current + qty, updatedAt: nowIso });
  await saveStock();

  const cfg = TYPE_CONFIG[type];
  showToast(`Entrée de stock ajoutée : +${qty} ${cfg.stockUnit}`);
  render();
}

// ---------- Vue agent ----------

function lastEntryFor(level, zone, blocId, type, unit){
  for(let i = log.length - 1; i >= 0; i--){
    const e = log[i];
    if(e.level === level && e.zone === zone && e.blocId === blocId && e.type === type && (e.unit || 1) === unit) return e;
  }
  return null;
}

function itemKey(level, zone, blocId, type, unit){
  return [level, zone, blocId, type, unit].join("|");
}

const DIST_FIELD = { papier: "wc", essuie: "essuie", savon: "savon" };

function renderAgentItemCard(bloc, type, unit, totalUnits){
  const cfg = TYPE_CONFIG[type];
  const dist = bloc[DIST_FIELD[type]];
  const last = lastEntryFor(currentLevel, currentZone, bloc.id, type, unit);
  const key = itemKey(currentLevel, currentZone, bloc.id, type, unit);
  const isEditing = editingKey === key;

  const card = document.createElement("div");
  card.className = "item";

  const top = document.createElement("div");
  top.className = "item-top";
  const nameBlock = document.createElement("div");
  const name = document.createElement("div");
  name.className = "item-name";
  name.textContent = cfg.label + (totalUnits > 1 ? " — distributeur " + unit + "/" + totalUnits : "");
  const meta = document.createElement("div");
  meta.className = "item-meta";
  const distLabel = totalUnits > 1
    ? "distributeur " + unit + " sur " + totalUnits
    : dist + " distributeur" + (dist > 1 ? "s" : "");
  meta.textContent = last
    ? distLabel + " · dernier réassort " + formatDateTime(last.at) + " (" + last.qty + " " + cfg.unit + ", " + last.agent + ")" + (last.editedAt ? " · corrigé" : "")
    : distLabel + " · pas encore de réassort noté";
  nameBlock.appendChild(name);
  nameBlock.appendChild(meta);
  top.appendChild(nameBlock);
  card.appendChild(top);

  if(isEditing){
    const editLabel = document.createElement("div");
    editLabel.className = "chip-label";
    editLabel.textContent = "Corriger la dernière saisie (" + cfg.unit + ")";
    card.appendChild(editLabel);

    const chips = document.createElement("div");
    chips.className = "chips";
    cfg.values.forEach(v => {
      const chip = document.createElement("button");
      chip.className = "chip" + (last && last.qty === v ? " selected-current" : "");
      chip.textContent = v;
      chip.addEventListener("click", async () => {
        editingKey = null;
        await editLastEntry(currentLevel, currentZone, bloc, type, unit, v);
        render();
      });
      chips.appendChild(chip);
    });
    card.appendChild(chips);

    const cancel = document.createElement("button");
    cancel.className = "edit-cancel-btn";
    cancel.textContent = "Annuler la correction";
    cancel.addEventListener("click", () => { editingKey = null; render(); });
    card.appendChild(cancel);

    return card;
  }

  const chips = document.createElement("div");
  chips.className = "chips";
  cfg.values.forEach(v => {
    const chip = document.createElement("button");
    const isJust = lastAction
      && lastAction.level === currentLevel && lastAction.zone === currentZone
      && lastAction.blocId === bloc.id && lastAction.type === type
      && lastAction.unit === unit && lastAction.value === v;
    chip.className = "chip" + (isJust ? " just-set" : "");
    chip.textContent = v;
    chip.addEventListener("click", async () => {
      const sameAsLast = lastAction
        && lastAction.level === currentLevel && lastAction.zone === currentZone
        && lastAction.blocId === bloc.id && lastAction.type === type && lastAction.unit === unit;

      if(sameAsLast){
        // Clic successif sur le même consommable : on corrige la saisie précédente
        // au lieu d'en ajouter une nouvelle (sinon les quantités s'additionnent à tort).
        await editLastEntry(currentLevel, currentZone, bloc, type, unit, v);
      } else {
        await addReassort(currentLevel, currentZone, bloc, type, v, unit);
      }
      lastAction = { level: currentLevel, zone: currentZone, blocId: bloc.id, type, unit, value: v };
      render();
    });
    chips.appendChild(chip);
  });
  card.appendChild(chips);

  const bottomRow = document.createElement("div");
  bottomRow.className = "chip-bottom-row";
  const label = document.createElement("span");
  label.className = "chip-label";
  label.textContent = "Quantité remise (" + cfg.unit + ")";
  bottomRow.appendChild(label);
  if(last){
    const editLink = document.createElement("button");
    editLink.className = "edit-link-btn";
    editLink.textContent = "Modifier";
    editLink.addEventListener("click", () => { editingKey = key; render(); });
    bottomRow.appendChild(editLink);
  }
  card.appendChild(bottomRow);

  return card;
}

function renderAgentTypeCards(bloc, type){
  if(type === "papier"){
    return [ renderAgentItemCard(bloc, "papier", 1, 1) ];
  }
  const n = bloc[DIST_FIELD[type]] || 1;
  const cards = [];
  for(let i = 1; i <= n; i++){
    cards.push(renderAgentItemCard(bloc, type, i, n));
  }
  return cards;
}

// ---------- Vue direction ----------

function totalsFor(level, zone, blocId, type){
  let total = 0, count = 0, last = null;
  log.forEach(e => {
    if(e.level === level && e.zone === zone && e.blocId === blocId && e.type === type){
      total += e.qty;
      count += 1;
      if(!last || e.at > last.at) last = e;
    }
  });
  return { total, count, last };
}

function flatBlocs(){
  const list = [];
  LEVELS.forEach(level => {
    ZONES.forEach(zone => {
      (BUILDING[level][zone] || []).forEach(bloc => {
        list.push({ level, zone, bloc });
      });
    });
  });
  return list;
}

function blocAvgDaily(level, zone, blocId, type){
  const cutoff = Date.now() - CONSO_WINDOW_DAYS * 24 * 3600 * 1000;
  const total = log
    .filter(e => e.level === level && e.zone === zone && e.blocId === blocId && e.type === type && new Date(e.at).getTime() >= cutoff)
    .reduce((s, e) => s + e.qty, 0);
  return total / CONSO_WINDOW_DAYS;
}

// ---------- Coût lié à la consommation ----------

// Prix moyen payé, par unité de stock (carton/ballot/cartouche), déduit des entrées de stock.
function avgUnitPriceStock(type){
  const entries = stockEntries.filter(e => e.type === type && e.price > 0 && e.qty > 0);
  const totalQty = entries.reduce((s, e) => s + e.qty, 0);
  const totalPrice = entries.reduce((s, e) => s + e.price, 0);
  if(totalQty <= 0) return null;
  return totalPrice / totalQty;
}

// Quantité totale consommée depuis le début (unité de réassort).
function totalConsumedAllTime(type){
  return log.filter(e => e.type === type).reduce((s, e) => s + e.qty, 0);
}

// Résumé coût pour un consommable : prix unitaire, valeur déjà consommée, projection mensuelle.
function costSummary(type){
  const unitPriceStock = avgUnitPriceStock(type);
  const ratio = getRatio(type);
  if(unitPriceStock === null || !ratio){
    return { known: false };
  }
  const unitPriceReassort = unitPriceStock / ratio;
  const consumedQty = totalConsumedAllTime(type);
  const consumedValue = unitPriceReassort * consumedQty;
  const monthlyQty = consumptionRate(type) * 30;
  const monthlyValue = unitPriceReassort * monthlyQty;
  return { known: true, unitPriceStock, unitPriceReassort, consumedValue, monthlyValue };
}

function renderConsumptionCharts(){
  const container = document.createElement("div");
  const blocs = flatBlocs();

  Object.keys(TYPE_CONFIG).forEach(type => {
    const cfg = TYPE_CONFIG[type];
    const rows = blocs
      .filter(({bloc}) => type !== "papier" || bloc.wc > 0)
      .map(({level, zone, bloc}) => ({
        level, zone, bloc,
        value: blocAvgDaily(level, zone, bloc.id, type),
      }));
    const max = Math.max(0.0001, ...rows.map(r => r.value));

    const section = document.createElement("div");
    section.className = "chart-section";
    const h3 = document.createElement("h3");
    h3.textContent = cfg.label + " — consommation moyenne par emplacement";
    const sub = document.createElement("div");
    sub.className = "chart-sub";
    sub.textContent = `Moyenne journalière sur les ${CONSO_WINDOW_DAYS} derniers jours (${cfg.unit})`;
    section.appendChild(h3);
    section.appendChild(sub);

    rows
      .slice()
      .sort((a, b) => b.value - a.value)
      .forEach(r => {
        const row = document.createElement("div");
        row.className = "bar-row";

        const labelRow = document.createElement("div");
        labelRow.className = "bar-label-row";
        const place = document.createElement("span");
        place.className = "bar-place";
        place.innerHTML = `<span class="bar-dot" style="background:${r.zone === 'SUD' ? 'var(--rose)' : 'var(--green)'}"></span>${r.bloc.name} (${r.level})`;
        const value = document.createElement("span");
        value.className = "bar-value";
        value.textContent = r.value > 0 ? r.value.toFixed(1) + " /j" : "—";
        labelRow.appendChild(place);
        labelRow.appendChild(value);

        const track = document.createElement("div");
        track.className = "bar-track";
        const fill = document.createElement("div");
        fill.className = "bar-fill zone-" + r.zone;
        const pct = r.value > 0 ? Math.max(3, (r.value / max) * 100) : 0;
        fill.style.width = pct + "%";
        track.appendChild(fill);

        row.appendChild(labelRow);
        row.appendChild(track);
        section.appendChild(row);
      });

    container.appendChild(section);
  });

  return container;
}

function renderCostPanel(){
  const panel = document.createElement("div");
  panel.className = "access-panel";

  let grandConsumedValue = 0;
  let grandMonthlyValue = 0;
  let anyKnown = false;
  let anyUnknown = false;

  Object.keys(TYPE_CONFIG).forEach(type => {
    const cfg = TYPE_CONFIG[type];
    const cost = costSummary(type);
    const row = document.createElement("div");
    row.className = "stat-row";
    const left = document.createElement("div");
    left.className = "stat-name";

    if(!cost.known){
      anyUnknown = true;
      left.innerHTML = `${cfg.label}<div class="stat-sub">Prix non renseigné — ajoutez une entrée de stock avec un prix</div>`;
      row.appendChild(left);
      panel.appendChild(row);
      return;
    }

    anyKnown = true;
    grandConsumedValue += cost.consumedValue;
    grandMonthlyValue += cost.monthlyValue;

    left.innerHTML = `${cfg.label}<div class="stat-sub">${cost.unitPriceStock.toFixed(2)} €/${cfg.stockUnit} · ${cost.unitPriceReassort.toFixed(2)} €/${cfg.unit}</div>`;
    const right = document.createElement("div");
    right.className = "stat-total";
    right.innerHTML = `${cost.consumedValue.toFixed(2)} € <span class="stat-unit">consommés</span>`;
    row.appendChild(left);
    row.appendChild(right);
    panel.appendChild(row);

    const sub = document.createElement("div");
    sub.className = "stock-detail";
    sub.innerHTML = `<span>Projection : ~${cost.monthlyValue.toFixed(2)} €/mois au rythme actuel</span>`;
    panel.appendChild(sub);
  });

  if(anyKnown){
    const totalRow = document.createElement("div");
    totalRow.className = "stock-entry-totals";
    totalRow.style.marginTop = "8px";
    totalRow.innerHTML = `<span class="total-general">Total consommé : <strong>${grandConsumedValue.toFixed(2)} €</strong> · ~${grandMonthlyValue.toFixed(2)} €/mois${anyUnknown ? " (partiel, prix manquant sur au moins un consommable)" : ""}</span>`;
    panel.appendChild(totalRow);
  } else {
    const empty = document.createElement("div");
    empty.className = "journal-empty";
    empty.textContent = "Ajoutez au moins une entrée de stock avec un prix pour voir le coût de la consommation.";
    panel.appendChild(empty);
  }

  return panel;
}

function renderConfirmButton(label, confirmLabel, onConfirm){
  const btn = document.createElement("button");
  btn.className = "maintenance-btn";
  btn.textContent = label;
  let armed = false;
  let timer = null;
  btn.addEventListener("click", () => {
    if(!armed){
      armed = true;
      btn.textContent = confirmLabel;
      btn.classList.add("armed");
      timer = setTimeout(() => { armed = false; btn.textContent = label; btn.classList.remove("armed"); }, 4000);
    } else {
      clearTimeout(timer);
      onConfirm();
    }
  });
  return btn;
}

function collapsibleSection(key, title, buildContentFn, defaultOpen){
  if(!(key in collapseState)) collapseState[key] = !!defaultOpen;
  const isOpen = collapseState[key];

  const wrapper = document.createElement("div");
  wrapper.className = "collapsible";

  const header = document.createElement("button");
  header.type = "button";
  header.className = "collapsible-header";
  header.innerHTML = `<span>${title}</span><span class="collapsible-chevron">${isOpen ? "▾" : "▸"}</span>`;
  header.addEventListener("click", () => {
    collapseState[key] = !collapseState[key];
    render();
  });
  wrapper.appendChild(header);

  if(isOpen){
    const content = document.createElement("div");
    content.className = "collapsible-content";
    content.appendChild(buildContentFn());
    wrapper.appendChild(content);
  }

  return wrapper;
}

  if(appState !== "app"){
    document.body.removeAttribute("data-zone");

  renderHeaderAuth();

  if(mode === "agent"){

  }
}
